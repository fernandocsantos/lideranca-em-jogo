<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0067BE">
  <meta name="description" content="Treinamento gamificado que simula cenários de lideranças de associações comerciais usando uma coleção de agentes de IA para compor uma ferramenta preditiva que reduz os riscos de atuações reais.">
  <title>Liderança em Jogo</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="sr" href="#conteudo">Pular para o conteúdo</a>
  <div class="app">
    <header class="barra-topo">
      <button type="button" class="botao-icone" id="voltar" hidden aria-label="Voltar"></button>
      <div class="titulo"><h1 id="titulo-tela">Liderança em Jogo</h1><span class="sub" id="subtitulo-tela"></span></div>
      <div class="controles-topo">
        <button type="button" class="botao-icone" id="som" aria-label="Som"></button>
        <button type="button" class="botao-icone" id="preferencias" aria-label="Acessibilidade e som"></button>
      </div>
    </header>
    <div class="marca-faixa" aria-hidden="true"></div>
    <div id="faixa-status" role="status" aria-live="polite"></div>
    <main id="conteudo" tabindex="-1"></main>
  </div>
  <nav class="abas" id="abas" aria-label="Áreas principais" hidden><div class="dentro" id="abas-dentro"></div></nav>
  <div id="aviso-curto" class="aviso-curto" role="status" aria-live="polite"></div>
  <script src="/static/icones.js"></script>
  <script src="/static/avatar.js"></script>
  <script src="/static/sons.js"></script>
  <script src="/static/relatorio.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
