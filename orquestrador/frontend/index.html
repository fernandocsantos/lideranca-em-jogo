<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liderança em Jogo — formação para associações comerciais</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <div class="marca"><span aria-hidden="true">◆</span> Liderança em Jogo</div>
    <nav aria-label="Navegação principal">
      <a href="/">Jogar</a>
      <a href="/conselho">Sala do Conselho</a>
      <a href="/facilitador">Facilitador</a>
    </nav>
    <div class="acessibilidade" role="group" aria-label="Acessibilidade">
      <button type="button" id="fonte-menos" aria-label="Diminuir letra">A−</button>
      <button type="button" id="fonte-mais" aria-label="Aumentar letra">A+</button>
      <button type="button" id="contraste" aria-pressed="false">Alto contraste</button>
    </div>
  </header>
  <div id="faixa-status" role="status" aria-live="polite"></div>
  <section id="indicadores" class="indicadores" aria-label="Indicadores da associação" hidden></section>
  <main id="conteudo" tabindex="-1"></main>
  <footer class="rodape">
    <p>Protótipo de código aberto (AGPL-3.0). Simulações por agentes de IA com o
      <a href="https://github.com/666ghj/MiroFish">MiroFish</a>. Cenários fictícios; quando inspirados em notícias,
      a fonte é indicada. Os resultados são exercícios de reflexão, não previsões.</p>
  </footer>
  <script src="/static/avatar.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
