# Sala do Conselho: experiência de dirigentes seniores.
temas:
  orcamento:       {nome: "Orçamento e prioridades",       icone: "💰"}
  parcerias:       {nome: "Parcerias e patrocínio",        icone: "🤝"}
  crise:           {nome: "Crise financeira",              icone: "📉"}
  poder_publico:   {nome: "Relação com o poder público",   icone: "🏛️"}
  engajamento:     {nome: "Engajamento dos associados",    icone: "👥"}
  sucessao:        {nome: "Sucessão na diretoria",         icone: "🔁"}

perguntas:
  - {id: informacao, texto: "Que informação costuma fazer diferença numa decisão como essa?"}
  - {id: caso,       texto: "Conte um caso que deu certo ou errado."}
  - {id: conselho,   texto: "O que você diria a quem está chegando à diretoria?"}

# Tema do cenário -> temas da Sala do Conselho cujas experiências aparecem na pauta
mapa_cenarios:
  orcamento_prioridades: [orcamento, engajamento]
  eventos_sazonais: [parcerias, engajamento]
  governanca_dados: [parcerias, crise]
  credito: [crise, parcerias]
  legislacao_municipal: [poder_publico, engajamento]
  seguranca: [poder_publico]
  mao_de_obra: [parcerias, poder_publico]
  inadimplencia: [crise, engajamento]
  reforma_tributaria: [poder_publico, sucessao]
  clima: [crise, poder_publico]
  varejo_digital: [parcerias, orcamento]

conselheiro:
  perguntas_por_trimestre: 3
  sugestoes:
    - "O que costuma fazer diferença numa decisão assim?"
    - "Alguém da rede já passou por algo parecido?"
    - "O que eu não posso esquecer ao comunicar?"

# Exemplos FICTÍCIOS, já aprovados, para a demonstração.
exemplos:
  - id: exemplo_teresa
    nome: "Dona Teresa (exemplo fictício)"
    entidade: "ACI fictícia do interior de SP"
    anos: 32
    avatar: {genero: f, idade: 71}
    tema: orcamento
    consentimento: com_nome
    respostas:
      informacao: "Quanto cada projeto traz de volta em mensalidades e quantos associados ele alcança de verdade."
      caso: "Num ano de caixa curto, dividimos o dinheiro em três projetos pequenos e nenhum deu resultado. No ano seguinte escolhemos um só, com meta clara, e mostramos o resultado na assembleia."
      conselho: "Escolha pouco e faça bem feito. E explique a quem ficou de fora quando vai chegar a vez dele."
  - id: exemplo_arlindo
    nome: "Seu Arlindo (exemplo fictício)"
    entidade: "Associação comercial fictícia"
    anos: 25
    avatar: {genero: m, idade: 68}
    tema: engajamento
    consentimento: com_nome
    respostas:
      informacao: "O que os associados dos bairros estão sentindo. Eles somem sem reclamar."
      caso: "Uma vez cortamos o atendimento para pagar um evento grande. Em seis meses perdemos quarenta associados, quase todos pequenos."
      conselho: "Atendimento é o que segura o associado; evento traz gente uma vez só."
