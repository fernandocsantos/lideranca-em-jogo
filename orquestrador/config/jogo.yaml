campanha:
  modo: demonstracao          # demonstracao = 2 trimestres do caso do guia; completa = + casos da biblioteca
  trimestres_iniciais: [guia_t1_orcamento, guia_t2_orcamento]
  perfil_padrao: media        # perfis em config/perfis/ (pequena, media, grande)
  numero_cenarios: 6          # só no modo completa (entre 5 e 8)
  indicadores_iniciais:
    engajamento: 55
    saude_financeira: 50
    reputacao: 55
    capital_politico: 50
    coesao: 60
    conformidade: 70

decisao:
  max_caracteres: 1500
  min_caracteres: 20
  minutos_reuniao: 10         # cronômetro de "reunião" na tela de orçamento
  max_perguntas_esclarecimento: 2

simulacao:
  max_rodadas: 20             # teto rígido: o jogador/facilitador não passa disso
  rodadas_padrao: 4           # a simulação roda em segundo plano; o resultado base sai na hora
  max_agentes: 15
  cache_simulacoes: true      # mesma pauta + mesma divisão do orçamento reaproveita a simulação (demonstração)

limites:
  simulacoes_por_dia: 4       # por jogador (MiroFish + contingência)
  simulacoes_por_dia_total: 60  # teto do site inteiro (cada aba anônima conta como um jogador novo)
  mensagens_conversa_por_tentativa: 20
  orcamento_mensal_brl: 100

fila:
  workers: 1

mirofish:
  url: http://mirofish:5001
  timeout_chamada_s: 60
  timeout_total_min: 25
  intervalo_polling_s: 3
  reutilizar_grafo: true
  plataforma: reddit
  manter_ambiente_min: 30
  idioma: pt
  rodadas_noturnas: 8             # o MiroFish começa à 0h simulada e os agentes só agem a partir das ~8h;
                                  # essas rodadas vazias não chamam o LLM (custo zero) e passam na hora
  gerar_relatorio: false          # o Report Agent leva ~4 min; os sinais saem direto das interações
  estabilidade_s: 45              # simulação concluída quando a atividade fica parada por este tempo
  memoria_no_grafo: false        # true travou o OASIS no teste real; ver docs/arquitetura.md
  tipos_genericos_excluidos: [Person, Organization]

facilitador:
  # Código definido em FACILITADOR_CODIGO no .env
  habilitado: true

# Roteiro da demonstração (botão "Roteiro da demonstração" na tela inicial). As escolhas são sempre as
# mesmas, então as simulações e respostas ficam em cache depois da primeira execução.
roteiro_demo:
  perfil: media
  trimestres:
    - relato: {interpretacao: formato, consultar: true}
      alternativas:
        - {digitalizacao: 12000, formacao_online: 6000, atendimento: 6000}
        - {digitalizacao: 12000, formacao_online: 8000, atendimento: 4000}
      escolher: 0
      motivo_alternativa: ["Atende mais associados", "Cabe nas horas da equipe"]
      alocacao: {digitalizacao: 12000, formacao_vendas: 0, formacao_online: 6000, atendimento: 6000}
      cortes_linhas:
        digitalizacao: ["Falta de horas da equipe"]
        formacao_vendas: ["Há alternativa mais barata", "Baixa adesão no passado"]
        atendimento: ["Menor impacto no curto prazo"]
      construtor:
        motivos: ["Mais associados beneficiados", "Cabe nas horas da equipe"]
        motivoLivre: "A formação vai para a noite, online, como os associados pediram"
        qtd: "25"
        oque: ["lojas vendendo pela internet"]
        prazo: ["o fim do trimestre"]
        revisao: ["30 dias"]
        responsavel: ["Diretoria executiva"]
        expectativa: ["Os lojistas vão aderir aos projetos financiados"]
      conversa: {ator: lojista_tradicional, pergunta: "O que você achou da formação online à noite?"}
    - continuidade: ajustar
      alocacao: {digitalizacao: 10500, formacao_vendas: 5000, atendimento: 8000, black_friday: 9000}
      cortes_linhas:
        digitalizacao: ["Pode esperar o próximo trimestre"]
      construtor:
        motivos: ["Mais associados beneficiados", "Maior impacto nas vendas"]
        motivoLivre: "A contrapartida da prefeitura exige meta pública; a Black Friday inclui os bairros."
        qtd: "60"
        oque: ["lojas participando da campanha"]
        prazo: ["60 dias"]
        revisao: ["30 dias"]
        responsavel: ["Gerência"]
        expectativa: ["A associação ganha visibilidade na cidade"]
      conversa: {ator: associado_bairro, pergunta: "O que você achou da decisão?"}
